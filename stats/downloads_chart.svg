<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="areaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect width="800" height="360" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>

  <!-- Title & Total Badge -->
  <text x="65" y="36" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="700">Release Downloads History</text>
  <text x="65" y="54" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12">Total Cumulative Downloads: <tspan fill="#38bdf8" font-weight="bold">13</tspan></text>

  <!-- Legend -->
  <g transform="translate(325, 24)">
    <circle cx="0" cy="8" r="4" fill="#38bdf8"/>
    <text x="10" y="12" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11">.exe: 4</text>
    
    <circle cx="95" cy="8" r="4" fill="#a78bfa"/>
    <text x="105" y="12" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11">.zip: 4</text>

    <circle cx="190" cy="8" r="4" fill="#4ade80"/>
    <text x="200" y="12" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11">.apk: 5</text>

    <circle cx="285" cy="8" r="4" fill="#fb923c"/>
    <text x="295" y="12" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11">AppImage: 0</text>
  </g>

  <!-- Grid -->
  <line x1="65" y1="300.0" x2="765" y2="300.0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/><text x="53" y="304.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="end">0</text><line x1="65" y1="256.2" x2="765" y2="256.2" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/><text x="53" y="260.2" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="end">4</text><line x1="65" y1="212.4" x2="765" y2="212.4" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/><text x="53" y="216.4" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="end">8</text><line x1="65" y1="168.6" x2="765" y2="168.6" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/><text x="53" y="172.6" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="end">12</text><line x1="65" y1="124.8" x2="765" y2="124.8" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/><text x="53" y="128.8" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="end">16</text><line x1="65" y1="70.0" x2="765" y2="70.0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/><text x="53" y="74.0" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="end">21</text>

  <!-- Area fill & Line path -->
  <path d="M 65 300 L 65 157.6 L 765 157.6 L 765 300 Z" fill="url(#areaGradient)"/>
  <path d="M 65 157.6 L 765 157.6" fill="none" stroke="url(#lineGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Markers & X-ticks -->
  <circle cx="65.0" cy="157.6" r="4" fill="#00f2fe" stroke="#0f172a" stroke-width="2"/><text x="65.0" y="147.6" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600" text-anchor="middle">13</text>
  <text x="65.0" y="322" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="middle">2026-10-10</text>
